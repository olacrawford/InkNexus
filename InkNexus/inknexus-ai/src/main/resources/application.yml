server:
  port: 8071

spring:
  application:
    name: ai-assistant
  # 流式对话（Flux SSE）的最长响应时间，需大于模型最大回复耗时
  mvc:
    async:
      request-timeout: 120s
  config:
    import:
      - optional:nacos:ai-assistant.yaml
  cloud:
    nacos:
      config:
        server-addr: localhost:8848
      discovery:
        server-addr: localhost:8848
        namespace: public
        group: DEFAULT_GROUP
