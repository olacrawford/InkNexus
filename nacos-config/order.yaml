spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/inknexus?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: 123456
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 5000

inknexus:
  order:
    expire-minutes: 30
    # 超时关单主链路是 RabbitMQ 延迟消息（TTL+死信），此 cron 只是兜底扫描周期
    close-cron: "0 */2 * * * ?"
    close-batch-size: 500
