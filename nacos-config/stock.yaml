spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/inknexus?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: 123456
    # 发布端确认：消息未到达 broker 或无法路由时记录 error 日志
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    # 消费端：失败本地重试 3 次后不再 requeue，经死信交换机进入 inknexus.dlx.queue 等待人工处理
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 10000

# Seata 客户端：deduct 由订单服务携带全局事务 XID 调用，自动注册为分支事务；
# 事务分组名必须与 order 侧一致
seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: inknexus_tx_group
  service:
    vgroup-mapping:
      inknexus_tx_group: default
    grouplist:
      default: localhost:8091
  registry:
    type: file
  config:
    type: file

# 日志带 TraceId：common 的 TraceIdFilter 把网关注入的 X-Trace-Id 写入 MDC，跨服务日志可串联
logging:
  pattern:
    level: "%5p [${spring.application.name:-},%X{traceId:-}]"
