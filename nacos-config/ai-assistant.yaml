spring:
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 8000

dashscope:
  api-key: ${DASHSCOPE_API_KEY:}
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  model: qwen-plus
  temperature: 0.7
  max-tokens: 1024
  timeout: 30s

ai-assistant:
  chat:
    memory-ttl-hours: 2
    tool-result-limit: 5
# 日志带 TraceId：common 的 TraceIdFilter 把网关注入的 X-Trace-Id 写入 MDC，跨服务日志可串联
logging:
  pattern:
    level: "%5p [${spring.application.name:-},%X{traceId:-}]"
