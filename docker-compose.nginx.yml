# 与 docker-compose.infra.yml 统一：官方镜像 + 挂载，不构建自定义镜像。
# 前置条件：front/dist/ 已存在（cd front && npm run build 生成）。
# 更新前端：重新 npm run build 后 `docker compose -f docker-compose.nginx.yml restart` 即可；
# 改 nginx.conf 后同样 restart 生效。
services:
  inknexus-nginx:
    image: nginx:1.27-alpine
    container_name: inknexus-nginx
    ports:
      - "80:80"
    volumes:
      - ./front/dist:/usr/share/nginx/html:ro
      - ./front/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
